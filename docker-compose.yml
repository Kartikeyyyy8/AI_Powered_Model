version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ai_powered_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai_powered_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai_powered_model
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ai_powered_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
